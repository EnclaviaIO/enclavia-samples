name: publish-images

# Builds each sample image and pushes it to the GitHub Container Registry
# so the samples are directly deployable (the Deploy on Enclavia button and
# `source_image` both need a public image). Runs on every push to main that
# touches a sample, and can be kicked off by hand.
#
# ONE-TIME setup after the first successful run: each new package is created
# private. Make the ones you want the deploy button to reach PUBLIC under
# the org's Packages settings (or the package's own "Package settings ->
# Change visibility"). Anonymous pull is what the mirror step requires.

on:
  push:
    branches: [main]
    paths:
      - '*/Dockerfile'
      - '*/app.py'
      - '*/requirements.txt'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every subdirectory that ships a Dockerfile (localhost-proxy is a
        # laptop-side binary, not an enclave image, so it is excluded).
        sample: [hello, egress, secrets, storage, notifier, upgrades, mnemonic-vault]
    steps:
      - uses: actions/checkout@v4

      # ghcr paths must be lowercase; the org login is not.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/enclavia-samples/${{ matrix.sample }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.sample }}
          # Enclaves run linux/amd64; build exactly that so the manifest is
          # single-platform and passes the deploy image inspection.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
